<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roulette Wheel | Wingo 11</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎡</text></svg>">
  <style>
    .roulette-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* Wheel Canvas Wrapper */
    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto;
    }

    #wheel-canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(245, 158, 11, 0.3);
      border: 6px solid #1e293b;
    }

    .wheel-pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #f59e0b;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
      z-index: 10;
    }

    .center-pinnacle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, #fbbf24 0%, #b45309 80%);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    /* Betting Board */
    .table-board {
      width: 100%;
      max-width: 820px;
      background: #09261a;
      border: 2px solid #10b981;
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      user-select: none;
    }

    .number-board-grid {
      display: grid;
      grid-template-columns: 50px repeat(12, 1fr);
      grid-template-rows: repeat(3, 44px);
      gap: 4px;
      margin-bottom: 8px;
    }

    .cell-zero {
      grid-row: 1 / span 3;
      background: #059669;
      color: white;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-family: var(--font-mono);
      font-size: 1.2rem;
      cursor: pointer;
      position: relative;
    }

    .bet-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-weight: 700;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: white;
      cursor: pointer;
      position: relative;
      transition: filter 0.15s ease, transform 0.15s ease;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.4);
    }

    .bet-cell:hover {
      filter: brightness(1.25);
      transform: scale(0.97);
    }

    .cell-red { background: #dc2626; }
    .cell-black { background: #1f2937; }

    .outside-bets-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }

    .outside-bets-row-2 {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .outside-cell {
      background: #0d3826;
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #e2e8f0;
      padding: 0.65rem 0.5rem;
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }

    .outside-cell:hover {
      background: #134e35;
      border-color: #34d399;
    }

    .chip-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #f59e0b;
      color: #000;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 0.65rem;
      border-radius: 99px;
      padding: 1px 5px;
      border: 1px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      pointer-events: none;
    }

    .last-spins-strip {
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      padding: 0.5rem 0;
    }

    .spin-bubble {
      min-width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: white;
    }
  </style>
</head>
<body>

  <header id="app-header"></header>

  <main class="container">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800;">🎡 Roulette Wheel</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Spin the European wheel with single-zero house rules. Pays up to 36X!</p>
      </div>
      <a href="index.html" class="btn btn-outline" style="padding: 0.45rem 1rem;">← Back to Games</a>
    </div>

    <div class="roulette-container">
      <!-- Interactive Spinning Wheel Canvas -->
      <div class="wheel-wrapper">
        <div class="wheel-pointer"></div>
        <canvas id="wheel-canvas" width="600" height="600"></canvas>
        <div class="center-pinnacle">👑</div>
      </div>

      <!-- Past Spins Strip -->
      <div class="glass-card" style="width: 100%; max-width: 820px; padding: 0.75rem 1.25rem;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">RECENT SPINS:</span>
          <div class="last-spins-strip" id="past-spins-container">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>

      <!-- Betting Table -->
      <div class="table-board">
        <!-- Numbers 0-36 Grid -->
        <div class="number-board-grid" id="number-board">
          <div class="cell-zero" data-bet="NUM_0">0</div>
          <!-- 1 to 36 filled by script -->
        </div>

        <!-- 1st 12, 2nd 12, 3rd 12 -->
        <div class="outside-bets-row">
          <div class="outside-cell" data-bet="DOZ_1">1st 12 (3X)</div>
          <div class="outside-cell" data-bet="DOZ_2">2nd 12 (3X)</div>
          <div class="outside-cell" data-bet="DOZ_3">3rd 12 (3X)</div>
        </div>

        <!-- 1-18, EVEN, RED, BLACK, ODD, 19-36 -->
        <div class="outside-bets-row-2">
          <div class="outside-cell" data-bet="LOW">1 to 18 (2X)</div>
          <div class="outside-cell" data-bet="EVEN">EVEN (2X)</div>
          <div class="outside-cell" style="background: rgba(220, 38, 38, 0.35); border-color: #ef4444;" data-bet="RED">RED (2X)</div>
          <div class="outside-cell" style="background: rgba(31, 41, 55, 0.7); border-color: #94a3b8;" data-bet="BLACK">BLACK (2X)</div>
          <div class="outside-cell" data-bet="ODD">ODD (2X)</div>
          <div class="outside-cell" data-bet="HIGH">19 to 36 (2X)</div>
        </div>
      </div>

      <!-- Controls & Chips -->
      <div class="glass-card" style="width: 100%; max-width: 820px;">
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
          <!-- Chip select -->
          <div style="display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
            <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">SELECT CHIP:</span>
            <button class="chip-btn active" data-chip="10">₹10</button>
            <button class="chip-btn" data-chip="50">₹50</button>
            <button class="chip-btn" data-chip="100">₹100</button>
            <button class="chip-btn" data-chip="500">₹500</button>
            <button class="chip-btn" data-chip="1000">₹1,000</button>
          </div>

          <!-- Total bet and Actions -->
          <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="font-size: 0.95rem;">
              Total Bet: <span id="roulette-total-bet" style="font-family: var(--font-mono); font-weight: 800; color: var(--accent-gold); font-size: 1.15rem;">₹0</span>
            </div>
            <button class="btn btn-outline" id="clear-bets-btn" style="padding: 0.55rem 1rem;">Clear</button>
            <button class="btn btn-emerald" id="spin-wheel-btn" style="padding: 0.65rem 1.8rem; font-size: 1.05rem;">
              🎡 Spin Wheel
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { setupNavbar, startAuthWatcher, showToast, currentUser } from "./shared.js";
    import { updateBalance } from "./firebase-config.js";
    import { sound } from "./audio.js";

    setupNavbar("");
    startAuthWatcher();

    // European Roulette Order (37 pockets)
    const WHEEL_NUMBERS = [
      0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
      5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
    ];

    const RED_NUMS = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);

    let currentAngle = 0;
    let isSpinning = false;
    let selectedChip = 10;
    let placedBets = {}; // { 'RED': 50, 'NUM_17': 20 }
    let pastSpins = [32, 15, 0, 4, 19];

    const canvas = document.getElementById("wheel-canvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spin-wheel-btn");
    const clearBtn = document.getElementById("clear-bets-btn");
    const totalBetEl = document.getElementById("roulette-total-bet");
    const pastSpinsContainer = document.getElementById("past-spins-container");

    // Draw Roulette Wheel Canvas
    function drawWheel(angle) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;
      const numPockets = WHEEL_NUMBERS.length;
      const arc = (2 * Math.PI) / numPockets;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(angle);

      for (let i = 0; i < numPockets; i++) {
        const pocketNum = WHEEL_NUMBERS[i];
        const pocketAngle = i * arc;

        // Slice color
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, pocketAngle, pocketAngle + arc);
        ctx.closePath();

        if (pocketNum === 0) {
          ctx.fillStyle = "#059669";
        } else if (RED_NUMS.has(pocketNum)) {
          ctx.fillStyle = "#dc2626";
        } else {
          ctx.fillStyle = "#1e293b";
        }
        ctx.fill();
        ctx.strokeStyle = "rgba(245, 158, 11, 0.4)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Draw Pocket Number text
        ctx.save();
        ctx.rotate(pocketAngle + arc / 2);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px 'Outfit', sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(pocketNum, radius - 20, 6);
        ctx.restore();
      }

      // Outer rim
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.strokeStyle = "#f59e0b";
      ctx.lineWidth = 5;
      ctx.stroke();

      ctx.restore();
    }

    drawWheel(0);

    // Populate Number Board (1 - 36 arranged in 3 rows)
    const boardGrid = document.getElementById("number-board");
    // Standard roulette grid column rows:
    // Row 1: 3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36
    // Row 2: 2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35
    // Row 3: 1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31, 34
    const rowNumbers = [
      [3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36],
      [2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35],
      [1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31, 34]
    ];

    rowNumbers.forEach((row, rowIndex) => {
      row.forEach((num, colIndex) => {
        const cell = document.createElement("div");
        const isRed = RED_NUMS.has(num);
        cell.className = `bet-cell ${isRed ? 'cell-red' : 'cell-black'}`;
        cell.style.gridRow = `${rowIndex + 1}`;
        cell.style.gridColumn = `${colIndex + 2}`;
        cell.textContent = num;
        cell.dataset.bet = `NUM_${num}`;
        boardGrid.appendChild(cell);
      });
    });

    // Render Past Spins
    function renderPastSpins() {
      pastSpinsContainer.innerHTML = pastSpins.slice(0, 8).map(n => {
        let colorClass = "#1f2937";
        if (n === 0) colorClass = "#059669";
        else if (RED_NUMS.has(n)) colorClass = "#dc2626";
        return `<span class="spin-bubble" style="background: ${colorClass};">${n}</span>`;
      }).join("");
    }
    renderPastSpins();

    // Chip select
    document.querySelectorAll(".chip-btn").forEach(btn => {
      btn.onclick = () => {
        sound.playClick();
        document.querySelectorAll(".chip-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedChip = parseInt(btn.dataset.chip);
      };
    });

    // Place bet handler on cell click
    document.querySelectorAll("[data-bet]").forEach(cell => {
      cell.onclick = () => {
        if (isSpinning) return;
        sound.playCoin();
        const betKey = cell.dataset.bet;
        placedBets[betKey] = (placedBets[betKey] || 0) + selectedChip;
        updateBetDisplay();
      };
    });

    function updateBetDisplay() {
      let total = 0;
      document.querySelectorAll(".chip-badge").forEach(b => b.remove());

      for (const [key, amt] of Object.entries(placedBets)) {
        total += amt;
        const cell = document.querySelector(`[data-bet="${key}"]`);
        if (cell && amt > 0) {
          const badge = document.createElement("span");
          badge.className = "chip-badge";
          badge.textContent = `₹${amt}`;
          cell.appendChild(badge);
        }
      }

      totalBetEl.textContent = `₹${total}`;
    }

    clearBtn.onclick = () => {
      if (isSpinning) return;
      sound.playClick();
      placedBets = {};
      updateBetDisplay();
    };

    // Spin Roulette Wheel
    spinBtn.onclick = async () => {
      if (isSpinning) return;
      if (!currentUser) {
        showToast("Please sign in with Google to play!", "info");
        return;
      }

      let totalBet = Object.values(placedBets).reduce((a, b) => a + b, 0);
      if (totalBet <= 0) {
        showToast("Please place at least one bet on the table!", "error");
        return;
      }

      if (currentUser.balance < totalBet) {
        showToast("Insufficient Balance! Please deposit funds to continue.", "error");
        return;
      }

      isSpinning = true;
      spinBtn.disabled = true;
      clearBtn.disabled = true;

      try {
        await updateBalance(currentUser.uid, -totalBet, `Roulette Bet Total ₹${totalBet}`);

        // Pick winning number
        const winningIndex = Math.floor(Math.random() * WHEEL_NUMBERS.length);
        const winningNumber = WHEEL_NUMBERS[winningIndex];

        // Animate Wheel
        const arc = (2 * Math.PI) / WHEEL_NUMBERS.length;
        // Pointer is at top (-PI/2). To align slice at top:
        const targetSliceAngle = (3 * Math.PI / 2) - (winningIndex * arc) - (arc / 2);
        const spins = 5 + Math.floor(Math.random() * 3); // 5-7 full spins
        const finalAngle = spins * (2 * Math.PI) + targetSliceAngle;

        const duration = 4500; // 4.5 seconds
        const startTime = performance.now();
        const startAngle = currentAngle % (2 * Math.PI);

        function animateWheel(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          // Ease out cubic
          const easeProgress = 1 - Math.pow(1 - progress, 3);
          currentAngle = startAngle + (finalAngle - startAngle) * easeProgress;
          drawWheel(currentAngle);

          if (Math.random() < 0.2) sound.playTick();

          if (progress < 1) {
            requestAnimationFrame(animateWheel);
          } else {
            finishSpin(winningNumber);
          }
        }

        requestAnimationFrame(animateWheel);
      } catch (err) {
        showToast(err.message, "error");
        isSpinning = false;
        spinBtn.disabled = false;
        clearBtn.disabled = false;
      }
    };

    async function finishSpin(winningNum) {
      isSpinning = false;
      spinBtn.disabled = false;
      clearBtn.disabled = false;

      pastSpins.unshift(winningNum);
      renderPastSpins();

      const isRed = RED_NUMS.has(winningNum);
      const isBlack = winningNum !== 0 && !isRed;
      const isEven = winningNum !== 0 && winningNum % 2 === 0;
      const isOdd = winningNum !== 0 && winningNum % 2 === 1;
      const isLow = winningNum >= 1 && winningNum <= 18;
      const isHigh = winningNum >= 19 && winningNum <= 36;
      const isDoz1 = winningNum >= 1 && winningNum <= 12;
      const isDoz2 = winningNum >= 13 && winningNum <= 24;
      const isDoz3 = winningNum >= 25 && winningNum <= 36;

      let totalWon = 0;

      for (const [key, amt] of Object.entries(placedBets)) {
        if (key === `NUM_${winningNum}`) totalWon += amt * 36;
        if (key === "RED" && isRed) totalWon += amt * 2;
        if (key === "BLACK" && isBlack) totalWon += amt * 2;
        if (key === "EVEN" && isEven) totalWon += amt * 2;
        if (key === "ODD" && isOdd) totalWon += amt * 2;
        if (key === "LOW" && isLow) totalWon += amt * 2;
        if (key === "HIGH" && isHigh) totalWon += amt * 2;
        if (key === "DOZ_1" && isDoz1) totalWon += amt * 3;
        if (key === "DOZ_2" && isDoz2) totalWon += amt * 3;
        if (key === "DOZ_3" && isDoz3) totalWon += amt * 3;
      }

      if (totalWon > 0) {
        sound.playWin();
        await updateBalance(currentUser.uid, totalWon, `Roulette Win on ${winningNum}`);
        showToast(`🎉 Ball landed on ${winningNum}! You won ₹${totalWon}!`, "success");
      } else {
        sound.playTick();
        showToast(`Ball landed on ${winningNum} (${winningNum === 0 ? 'Zero' : isRed ? 'Red' : 'Black'}). Better luck next spin!`, "info");
      }
    }
  </script>
</body>
</html>
